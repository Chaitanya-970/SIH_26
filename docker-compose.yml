version: '3.8'

services:
  ollama:
    image: ollama/ollama
    deploy:
      resources:
        limits:
          memory: 6G
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/opt/citadel/data
      - ./models.yaml:/app/models.yaml
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://backend:8000
    depends_on:
      - backend

# Note: The Docker Sandbox for code execution is spun up dynamically by the backend,
# it is not orchestrated as a long-running service in this compose file.

volumes:
  ollama_data:
